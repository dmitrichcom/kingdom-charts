name: example-service
replicas: 1
podSpec:
  containers:
  - name: example-service
    image: ghcr.io/example/service@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    ports:
    - name: http
      containerPort: 8080
    readinessProbe:
      exec:
        command: [/bin/check]
service:
  enabled: true
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: http

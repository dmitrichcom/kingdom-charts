stack: example-app
workloads:
  api:
    kind: Deployment
    replicas: 2
    podSpec:
      containers:
        - name: api
          image: registry.example.test/team/api:v2.3.4
          ports:
            - name: http
              containerPort: 8080
    service:
      ports:
        - name: http
          port: 8080
          targetPort: http
  worker:
    kind: Deployment
    podSpec:
      runtimeClassName: runsc
      containers:
        - name: worker
          image: ghcr.io/example/worker:independent-version
  database:
    kind: StatefulSet
    workloadSpec:
      serviceName: database
    podSpec:
      containers:
        - name: postgres
          image: postgres:17-alpine
    service:
      clusterIP: None
      publishNotReadyAddresses: true
      ports:
        - name: postgres
          port: 5432
  migrate:
    kind: Job
    workloadSpec:
      backoffLimit: 0
    podSpec:
      restartPolicy: Never
      containers:
        - name: migration
          image: registry.example.test/team/migration:v2.3.4
          command: [/app]
          args: [migrate]
resources:
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: worker-connectivity
    spec:
      podSelector:
        matchLabels:
          app.kubernetes.io/name: worker
          kingdom.dmitrich.com/stack: example-app
      policyTypes: [Ingress, Egress]
      ingress:
        - from:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/name: api
                  kingdom.dmitrich.com/stack: example-app
      egress:
        - to:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/name: api
                  kingdom.dmitrich.com/stack: example-app
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: api-connectivity
    spec:
      podSelector:
        matchLabels:
          app.kubernetes.io/name: api
          kingdom.dmitrich.com/stack: example-app
      policyTypes: [Ingress, Egress]
      ingress:
        - from:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/name: worker
                  kingdom.dmitrich.com/stack: example-app
      egress: [{}]
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: example-settings
    data:
      settings.json: '{"enabled":true}'

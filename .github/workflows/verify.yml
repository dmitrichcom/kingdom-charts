name: Validate portable Kingdom Helm charts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned compiler test dependencies
        run: python -m pip install 'PyYAML==6.0.3'
      - name: Validate Helm charts (same command as qgate gate)
        run: sh scripts/test-chart.sh
      - name: Validate Kubernetes compiler (same command as qgate gate)
        run: sh scripts/test-compiler.sh

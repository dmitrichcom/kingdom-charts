name: Validate portable Kingdom Helm charts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - name: Validate Helm charts (same command as qgate gate)
        run: sh scripts/test-chart.sh

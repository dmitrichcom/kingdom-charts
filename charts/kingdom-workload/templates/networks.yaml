{{- range $name, $workload := .Values.workloads -}}
{{- $context := dict "root" $ "name" $name "workload" $workload -}}
{{- $networks := include "kingdom.networks" $context | fromJson -}}
{{- if gt (len $networks) 0 -}}
{{- $stack := include "kingdom.stack" $context -}}
{{- $peers := list -}}
{{- $outbound := false -}}
{{- range $network, $options := $networks -}}
{{- $peers = append $peers (dict "podSelector" (dict "matchLabels" (dict "kingdom.dmitrich.com/stack" $stack (printf "kingdom.dmitrich.com/network-%s" $network) "true"))) -}}
{{- if not $options.internal -}}{{- $outbound = true -}}{{- end -}}
{{- end -}}
{{- $egress := list (dict "to" $peers) -}}
{{- if $outbound -}}{{- $egress = list dict -}}{{- end -}}
{{- $spec := dict "podSelector" (dict "matchLabels" (dict "app.kubernetes.io/name" $name "kingdom.dmitrich.com/stack" $stack)) "policyTypes" (list "Ingress" "Egress") "ingress" (list (dict "from" $peers)) "egress" $egress -}}
---
{{ toYaml (dict "apiVersion" "networking.k8s.io/v1" "kind" "NetworkPolicy" "metadata" (dict "name" (include "kingdom.policyName" $name) "namespace" $.Release.Namespace) "spec" $spec) }}
{{ end -}}
{{ end -}}

{{- range $name, $workload := .Values.workloads -}}
{{- $context := dict "root" $ "name" $name "workload" $workload -}}
{{- $kind := $workload.kind | default "Deployment" -}}
{{- $stack := include "kingdom.stack" $context -}}
{{- $labels := include "kingdom.labels" $context | fromYaml -}}
{{- $annotations := deepCopy ($workload.podAnnotations | default dict) -}}
{{- range $key := list "kingdom.dmitrich.com/compose-networks" "kingdom.dmitrich.com/compose-network-external" -}}
{{- if hasKey $annotations $key -}}
{{- fail (printf "%s is not supported; declare native Service and NetworkPolicy resources" $key) -}}
{{- end -}}
{{- end -}}
{{- $metadataAnnotations := deepCopy ($workload.annotations | default dict) -}}
{{- $_ := set $metadataAnnotations "kingdom.dmitrich.com/stack" $stack -}}
{{- $metadata := dict "name" $name "namespace" $.Release.Namespace "labels" $labels "annotations" $metadataAnnotations -}}
{{- $pod := deepCopy $workload.podSpec -}}
{{- if ($workload.telemetry | default dict).traces -}}
{{- include "kingdom.telemetry.traces" (dict "pod" $pod "annotations" $annotations) -}}
{{- end -}}
{{- $spec := deepCopy ($workload.workloadSpec | default dict) -}}
{{- range $reserved := list "template" "selector" "replicas" -}}
{{- if hasKey $spec $reserved -}}{{- fail (printf "workloadSpec.%s is chart-owned" $reserved) -}}{{- end -}}
{{- end -}}
{{- if eq $kind "Job" -}}
{{- if not (hasKey $pod "restartPolicy") -}}{{- $_ := set $pod "restartPolicy" "Never" -}}{{- end -}}
{{- if not (hasKey $spec "backoffLimit") -}}{{- $_ := set $spec "backoffLimit" 0 -}}{{- end -}}
{{- else -}}
{{- $replicas := 1 -}}
{{- if hasKey $workload "replicas" -}}{{- $replicas = $workload.replicas -}}{{- end -}}
{{- $_ := set $spec "replicas" $replicas -}}
{{- $_ := set $spec "selector" (dict "matchLabels" (dict "app.kubernetes.io/name" $name "kingdom.dmitrich.com/stack" $stack)) -}}
{{- end -}}
{{- if and (eq $kind "StatefulSet") (not (hasKey $spec "serviceName")) -}}
{{- $_ := set $spec "serviceName" $name -}}
{{- end -}}
{{- $_ := set $spec "template" (dict "metadata" (dict "labels" $labels "annotations" $annotations) "spec" $pod) -}}
{{- $api := ternary "batch/v1" "apps/v1" (eq $kind "Job") -}}
---
{{ toYaml (dict "apiVersion" $api "kind" $kind "metadata" $metadata "spec" $spec) }}
{{ end -}}
